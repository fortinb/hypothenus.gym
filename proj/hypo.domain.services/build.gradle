plugins {
    id 'java-library'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java-test-fixtures'
    id 'org.openapi.generator' version '7.23.0'
    id 'eclipse'
}

group = "com.hypo"
version = '0.0.1'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(23)
  }
}

// Add compiler arg so parameter names are available at runtime
// This ensures the '-parameters' flag is passed to javac for all JavaCompile tasks (main, test, and test-fixtures)
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.compilerArgs += ['-parameters']
}


repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

 //  implementation 'org.mongodb:mongodb-driver-sync:5.1.0'
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.modelmapper:modelmapper:3.2.5'
    implementation 'io.cloudevents:cloudevents-core:2.3.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'com.microsoft.graph:microsoft-graph:6.61.0'
	implementation 'com.microsoft.graph:microsoft-graph-core:3.6.5'
	implementation 'com.azure:azure-identity:1.18.2'
	implementation files('lib/JavaAPI.jar')
	compileOnly 'org.projectlombok:lombok:1.18.32'
	annotationProcessor 'org.projectlombok:lombok:1.18.32'
	testCompileOnly 'org.projectlombok:lombok:1.18.32'
	testCompileOnly 'net.datafaker:datafaker:1.8.0' 
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.32'
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Ensure test fixtures have the libraries they use (Faker, Lombok)
	testFixturesImplementation 'net.datafaker:datafaker:1.8.0'
	testFixturesCompileOnly 'org.projectlombok:lombok:1.18.32'
	implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
	implementation 'io.swagger.core.v3:swagger-annotations:2.2.21'
	testFixturesAnnotationProcessor 'org.projectlombok:lombok:1.18.32'
}

// ─── Moneris REST API client generation ──────────────────────────────────────
def monerisSpec = "$rootDir/src/main/openapi/moneris-api-2025-08-14.yaml"

openApiGenerate {
    generatorName = "java"
    library        = "resttemplate"
    inputSpec      = monerisSpec
    outputDir      = layout.buildDirectory.dir("generated/moneris-client").get().asFile.path
    apiPackage     = "com.iso.hypo.finance.infrastructure.moneris.api"
    modelPackage   = "com.iso.hypo.finance.infrastructure.moneris.model"
    invokerPackage = "com.iso.hypo.finance.infrastructure.moneris.invoker"
    configOptions  = [
        useJakartaEe     : "true",   // Spring Boot 3.x uses Jakarta EE 10
        openApiNullable  : "false",
        dateLibrary      : "java8",
        serializationLibrary: "jackson"
    ]
}

// Skip generation when the spec file does not exist yet
// onlyIf is a task method — it must be set on the task, not inside the extension block
tasks.named('openApiGenerate') {
    onlyIf { file(monerisSpec).exists() }
}

// ── Compile generated code in its own source set so -nowarn applies only
//    to generated files, leaving hand-written code warnings intact ──────────
sourceSets {
    // Dedicated source set for the OpenAPI-generated client
    monerisClient {
        java {
            srcDir layout.buildDirectory.dir("generated/moneris-client/src/main/java")
        }
        // Reuse every jar already resolved for the main source set
        compileClasspath += sourceSets.main.compileClasspath
    }
}

// Make compiled generated classes visible when compiling and running main code
sourceSets.main {
    compileClasspath += sourceSets.monerisClient.output
    runtimeClasspath += sourceSets.monerisClient.output
}

// Include generated classes in the published jar
jar {
    from sourceSets.monerisClient.output
}

// Compile the generated client suppressing all warnings (-nowarn)
tasks.named('compileMonerisClientJava') {
    options.compilerArgs = ['-parameters', '-nowarn']
}

// Hand-written code must wait for the generated code to be compiled first
compileJava.dependsOn 'compileMonerisClientJava'
// ─────────────────────────────────────────────────────────────────────────────

// ── Eclipse: suppress all warnings for the OpenAPI-generated source folder ───
// Eclipse (ECJ) ignores javac's -nowarn flag.  The classpath attribute
// "ignore_optional_problems=true" is the standard Eclipse mechanism to tell
// the IDE to skip all optional diagnostics (unused imports, raw types, etc.)
// for a specific source folder, while leaving warnings intact everywhere else.
// After any build.gradle change run: Gradle > Refresh Gradle Project in Eclipse.
eclipse {
    classpath {
        file.whenMerged { cp ->
            cp.entries
                .findAll { it instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder &&
                           it.path.contains('moneris-client') }
                .each    { it.entryAttributes['ignore_optional_problems'] = 'true' }
        }
    }
}
// ─────────────────────────────────────────────────────────────────────────────

test {
    useJUnitPlatform()
}